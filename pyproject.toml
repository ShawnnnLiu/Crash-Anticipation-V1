[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crash-anticipation"
version = "0.1.0"
description = "Baseline framework for crash anticipation on the DAD dataset"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Crash Anticipation Team" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9.16",
    "opencv-python>=4.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "decord>=0.6.0",
    "rich>=13.7",
    "tensorboard>=2.15"
]

[project.optional-dependencies]
dev = [
    "black>=23.11",
    "isort>=5.12",
    "ruff>=0.1.6",
    "pytest>=7.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crash_anticipation*"]

